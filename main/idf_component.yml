dependencies:
  idf: ">=6.2"
  esp-mosaico-bsp:
    version: "*"
    override_path: "../../../submodule/esp-mosaico-bsp/components/esp-mosaico-bsp"
  esp_iris:
    version: "*"
    override_path: "../../../submodule/esp-mosaico-utils/ESP-Iris/components/esp_iris"
  # OV3640 camera module in the left slot, plus the hardware JPEG path.
  mosaico_module_camera:
    version: "*"
    override_path: "../../../submodule/esp-mosaico-bsp/components/mosaico_module_camera"
  mosaico_module_mgr:
    version: "*"
    override_path: "../../../submodule/esp-mosaico-bsp/components/mosaico_module_mgr"
  espressif/esp-gsp: "==1.5.1"
  # The BSP display adapter uses headers deprecated by LVGL 9.6.
  lvgl/lvgl: "==9.5.0"
  # Block-mode software JPEG decoder: the 2048x1536 still is developed in strips.
  espressif/esp_new_jpeg: "^1.0.0"
  # Photos live on the onboard NAND, mounted like Vibe Mode does (LittleFS, never
  # formatted). spi_nand_flash comes from the BSP.
  joltwallet/littlefs: "^1.22.0"
